services:
  - type: web
    runtime: static
    name: lumen-lector
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    headers:
      - path: /update/*
        name: Cache-Control
        value: no-cache
      - path: /update/*
        name: Access-Control-Allow-Origin
        value: "*"
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
